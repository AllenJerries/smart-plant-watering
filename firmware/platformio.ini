; PlatformIO project for the Smart Plant Watering ESP32 node.
; Usage:
;   pio run -t upload
;   pio device monitor -b 115200
;
; The sketch has no external library dependencies: Wi-Fi, HTTPS and deep sleep
; are all part of the ESP32 Arduino core.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
